<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGRED - CCESN | Sala Situacional Nacional</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- html2pdf para generación de Reportes en PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Chart.js para Gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --accent-yellow: #eab308;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header {
            background-color: #090d16;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #b91c1c;
        }
        .header-title { display: flex; align-items: center; gap: 12px; }
        .header-title h1 { font-size: 1.1rem; font-weight: 700; color: #ffffff; }
        .header-title span { font-size: 0.75rem; background: #b91c1c; color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-pdf {
            background: #b91c1c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-pdf:hover { background: #dc2626; }

        .main-container { display: flex; flex: 1; height: calc(100vh - 50px); overflow: hidden; }

        .sidebar {
            width: 380px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
            overflow-y: auto;
        }

        .card { background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; }
        .card-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; }

        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .kpi-box { background: #1e293b; padding: 8px; border-radius: 4px; text-align: center; border-left: 3px solid var(--accent-blue); }
        .kpi-box.danger { border-left-color: var(--accent-red); }
        .kpi-box.warning { border-left-color: var(--accent-orange); }
        .kpi-value { font-size: 1.2rem; font-weight: bold; }
        .kpi-label { font-size: 0.65rem; color: var(--text-muted); }

        .filter-group select {
            width: 100%;
            background: #1e293b;
            color: white;
            border: 1px solid var(--border-color);
            padding: 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 0.8rem;
        }

        .map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; background: #0b0f19; }
        .chart-container { position: relative; height: 140px; width: 100%; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>UGRED — Centro de Coordinación de Emergencias en Salud Nacional</h1>
            <span>CCESN</span>
        </div>
        <div class="header-actions">
            <button class="btn-pdf" onclick="generarReportePDF()">
                <i class="fa-solid fa-file-pdf"></i> Generar SpotRep PDF
            </button>
        </div>
    </header>

    <div class="main-container" id="reporte-content">
        <aside class="sidebar">
            <div class="card">
                <div class="card-title">Alertas por Nivel de Riesgo Municipal</div>
                <div class="kpi-grid">
                    <div class="kpi-box danger">
                        <div class="kpi-value" id="kpi-rojo">0</div>
                        <div class="kpi-label">Riesgo Alto</div>
                    </div>
                    <div class="kpi-box warning">
                        <div class="kpi-value" id="kpi-naranja">0</div>
                        <div class="kpi-label">Riesgo Medio</div>
                    </div>
                    <div class="kpi-box">
                        <div class="kpi-value" id="kpi-amarillo">0</div>
                        <div class="kpi-label">Bajo / Monitoreo</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Filtro Territorial</div>
                <div class="filter-group">
                    <select id="filter-dept" onchange="aplicarFiltros()">
                        <option value="todos">Todos los Departamentos</option>
                        <option value="La Paz">La Paz</option>
                        <option value="Santa Cruz">Santa Cruz</option>
                        <option value="Cochabamba">Cochabamba</option>
                        <option value="Beni">Beni</option>
                        <option value="Pando">Pando</option>
                        <option value="Oruro">Oruro</option>
                        <option value="Potosí">Potosí</option>
                        <option value="Chuquisaca">Chuquisaca</option>
                        <option value="Tarija">Tarija</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Consolidado por Tipo de Evento</div>
                <div class="chart-container">
                    <canvas id="chartTipos"></canvas>
                </div>
            </div>
        </aside>

        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <script>
        const map = L.map('map').setView([-16.2902, -63.5887], 6);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        function generarReportePDF() {
            const element = document.getElementById('reporte-content');
            const opt = {
                margin:       0.5,
                filename:     'SpotRep_UGRED_CCESN.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }

        const municipiosData = [
            { municipio: "El Alto", dept: "La Paz", riesgo: "Alto", lat: -16.5, lng: -68.19, evento: "Inundación / Alerta Sanitaria" },
            { municipio: "San Ignacio", dept: "Santa Cruz", riesgo: "Alto", lat: -16.37, lng: -60.95, evento: "Focos de Calor VIIRS" },
            { municipio: "Uyuni", dept: "Potosí", lat: -20.46, lng: -66.82, riesgo: "Medio", evento: "Sismo GDACS M4.1" }
        ];

        let markersGroup = L.layerGroup().addTo(map);

        function renderizarMapa(datos) {
            markersGroup.clearLayers();
            let alto = 0, medio = 0, bajo = 0;

            datos.forEach(m => {
                if(m.riesgo === "Alto") alto++;
                if(m.riesgo === "Medio") medio++;
                if(m.riesgo === "Bajo") bajo++;

                let color = m.riesgo === "Alto" ? "#ef4444" : "#f97316";

                const circle = L.circleMarker([m.lat, m.lng], {
                    radius: 10,
                    fillColor: color,
                    color: "#fff",
                    weight: 2,
                    fillOpacity: 0.8
                });

                circle.bindPopup(`
                    <div style="color:#0f172a;">
                        <strong>Municipio: ${m.municipio}</strong><br>
                        <b>Depto:</b> ${m.dept}<br>
                        <b>Evento:</b> ${m.evento}<br>
                        <b>Nivel de Riesgo:</b> <span style="color:${color}; font-weight:bold;">${m.riesgo}</span>
                    </div>
                `);

                markersGroup.addLayer(circle);
            });

            document.getElementById('kpi-rojo').innerText = alto;
            document.getElementById('kpi-naranja').innerText = medio;
            document.getElementById('kpi-amarillo').innerText = bajo;
        }

        renderizarMapa(municipiosData);
    </script>
</body>
</html>
